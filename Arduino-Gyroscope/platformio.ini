; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Flash all OTA devices in parallel:      pio run -t upload -j 10
; Flash a single device:                  pio run -e E35433 -t upload
; Flash one device via USB (first time / recovery / password change):
;                                         pio run -e usb-E35433 -t upload
;
; Secrets (both untracked, see the *_template files):
;   src/secrets.h   WiFi / router / OTA passwords compiled into the firmware (from src/secrets_template.h)
;   secrets.ini     OTA password for the upload (from secrets.ini.template); must equal SECRET_OTA_PASS
; Without secrets.ini the build works, but OTA uploads fail (empty password).

[ota]
password =

[platformio]
extra_configs = secrets.ini
default_envs = E94464, E35433, E35434, E35435, E35436, E35437, E35438, E35439, E35440, E35441

[env:base]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_deps =
	arduino-libraries/Arduino_LSM6DS3@^1.0.3
	adafruit/Adafruit LSM6DS
monitor_speed = 115200
monitor_flags = --raw


[env:ota_base]
extends = env:base
upload_protocol = espota
upload_flags = --auth=${ota.password}

; ================================
; Per-device environments
; Fill in actual DEVICE_IDs and hostnames/IPs for your 10 units
; ================================

[env:E94464]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E94464\"
upload_port = Kreisel-E94464.local

[env:E35433]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35433\"
upload_port = Kreisel-E35433.local

[env:E35434]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35434\"
upload_port = Kreisel-E35434.local

[env:E35435]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35435\"
upload_port = Kreisel-E35435.local

[env:E35436]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35436\"
upload_port = Kreisel-E35436.local

[env:E35437]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35437\"
upload_port = Kreisel-E35437.local

[env:E35438]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35438\"
upload_port = Kreisel-E35438.local

[env:E35439]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35439\"
upload_port = Kreisel-E35439.local

[env:E35440]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35440\"
upload_port = Kreisel-E35440.local

[env:E35441]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35441\"
upload_port = Kreisel-E35441.local

; ================================
; USB environments, one per unit (the device ID becomes the WiFi name Kreisel-<ID>)
; ================================

[env:usb-E94464]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E94464\"

[env:usb-E35433]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35433\"

[env:usb-E35434]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35434\"

[env:usb-E35435]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35435\"

[env:usb-E35436]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35436\"

[env:usb-E35437]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35437\"

[env:usb-E35438]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35438\"

[env:usb-E35439]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35439\"

[env:usb-E35440]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35440\"

[env:usb-E35441]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E35441\"
