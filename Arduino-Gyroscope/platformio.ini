; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Flash all OTA devices in parallel:      pio run -t upload -j 10
; Flash a single device:                  pio run -e E35433 -t upload
; Flash one device via USB (first time / recovery / password change):
;                                         pio run -e usb-E35433 -t upload
;
; Secrets (both untracked, see the *_template files):
;   src/secrets.h   WiFi / router / OTA passwords compiled into the firmware (from src/secrets_template.h)
;   secrets.ini     OTA password for the upload (from secrets.ini.template); must equal SECRET_OTA_PASS
; Without secrets.ini the build works, but OTA uploads fail (empty password).

[ota]
password =

[platformio]
extra_configs = secrets.ini
default_envs = E94464, E75325, E95454, E71940, E76347, E88692, E65320, E81335, E46934, E35432

[env:base]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_deps =
	arduino-libraries/Arduino_LSM6DS3@^1.0.3
	adafruit/Adafruit LSM6DS
monitor_speed = 115200
monitor_flags = --raw


[env:ota_base]
extends = env:base
upload_protocol = espota
upload_flags = --auth=${ota.password}

; ================================
; Per-device environments
; Fill in actual DEVICE_IDs and hostnames/IPs for your 10 units
; ================================

[env:E94464]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E94464\"
upload_port = Kreisel-E94464.local

[env:E75325]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E75325\"
upload_port = Kreisel-E75325.local

[env:E95454]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E95454\"
upload_port = Kreisel-E95454.local

[env:E71940]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E71940\"
upload_port = Kreisel-E71940.local

[env:E76347]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E76347\"
upload_port = Kreisel-E76347.local

[env:E88692]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E88692\"
upload_port = Kreisel-E88692.local

[env:E65320]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E65320\"
upload_port = Kreisel-E65320.local

[env:E81335]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E81335\"
upload_port = Kreisel-E81335.local

[env:E46934]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E46934\"
upload_port = Kreisel-E46934.local

[env:E35432]
extends = env:ota_base
build_flags = -DDEVICE_ID_STR=\"E35432\"
upload_port = Kreisel-E35432.local

; ================================
; USB environments, one per unit (the device ID becomes the WiFi name Kreisel-<ID>)
; ================================

[env:usb-E94464]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E94464\"

[env:usb-E75325]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E75325\"

[env:usb-E95454]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E95454\"

[env:usb-E71940]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E71940\"

[env:usb-E76347]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E76347\"

[env:usb-E88692]
extends = env:base
build_flags = -DDEVICE_ID_STR=\"E88692\"

[env:usb-E65320]
extends = env:base
